
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 10px #ccc;
        }

        h1 {
            color: #333;
        }

        .estrelas {
            font-size: 40px;
            margin: 20px 0;
        }

        .estrela {
            cursor: pointer;
            color: #ccc;
        }

        .estrela.selecionada {
            color: #ffc107;
        }

        button {
            background: #333;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        #mensagem {
            margin-top: 15px;
            color: green;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Avalie nossa experiência</h1>

        <p>Quantas estrelas você daria?</p>

        <div class="estrelas">
            <span class="estrela" onclick="avaliar(1)">★</span>
            <span class="estrela" onclick="avaliar(2)">★</span>
            <span class="estrela" onclick="avaliar(3)">★</span>
            <span class="estrela" onclick="avaliar(4)">★</span>
            <span class="estrela" onclick="avaliar(5)">★</span>
        </div>

        <button onclick="enviar()">Enviar avaliação</button>

        <p id="mensagem"></p>
    </div>

    <script>
        let nota = 0;

        function avaliar(valor) {
            nota = valor;

            let estrelas = document.querySelectorAll(".estrela");

            estrelas.forEach((estrela, index) => {
                estrela.classList.toggle("selecionada", index < valor);
            });
        }

        function enviar() {
            let mensagem = document.getElementById("mensagem");

            if (nota === 0) {
                mensagem.style.color = "red";
                mensagem.innerText = "Selecione uma quantidade de estrelas!";
            } else {
                mensagem.style.color = "green";
                mensagem.innerText = "Obrigado pela sua avaliação de " + nota + " estrelas!";
            }
        }
    </script>

</body>
</html>
